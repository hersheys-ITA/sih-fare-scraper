name: Daily Fare Scraper

on:
  schedule:
    - cron: '0 3 * * *'  # runs daily at 3:00 AM UTC (~8:30 AM IST)
  workflow_dispatch:  # lets you manually trigger it too, for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Install virtual display
        run: sudo apt-get install -y xvfb

      - name: Run scraper with virtual display
        run: xvfb-run --auto-servernum python scraper.py

      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add fare_data.csv
          git commit -m "Daily fare data update" || echo "No changes to commit"
          git push