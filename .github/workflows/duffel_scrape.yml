name: Daily Duffel Fare Collection

on:
  schedule:
    - cron: '15 3 * * *'  # runs daily at 3:15 AM UTC (~8:45 AM IST) - offset from the Ixigo scraper so they don't collide
  workflow_dispatch:  # lets you manually trigger it too, for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Duffel collector
        env:
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
        run: python duffel_scraper.py

      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add fare_data_duffel.csv
          git commit -m "Daily Duffel fare data update" || echo "No changes to commit"
          git push