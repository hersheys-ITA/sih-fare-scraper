name: Daily Analysis Pipeline

on:
  schedule:
    - cron: '45 3 * * *'   # 9:15 AM IST
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run merge pipeline
        run: |
          python analysis/merge_fares.py